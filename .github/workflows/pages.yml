name: Pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "tool/visibility/**"
      - "tool/fix_pages_base.py"
      - "site/**"
      - "llms.txt"
      - "llms-full.txt"
      - "identity.json"
      - "developer-ai.txt"
      - "faq-ai.txt"
      - "ai.txt"
      - "robots-ai.txt"
      - "robots.txt"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**"
      - ".cursor/rules/**"
      - ".windsurfrules"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Jaspr docs and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify generated visibility files
        run: dart run tool/visibility/generate_visibility.dart --check

      - name: Stage discovery files into the Jaspr web root
        run: |
          mkdir -p site/web
          cp llms.txt site/web/llms.txt
          cp site/favicon.svg site/web/favicon.svg

      - name: Install site dependencies
        working-directory: site
        run: dart pub get

      - name: Activate Jaspr
        run: dart pub global activate jaspr_cli

      - name: Build site
        working-directory: site
        run: dart pub global run jaspr_cli:jaspr build --verbose --sitemap-domain https://turkananation.github.io/pqforge

      - name: Rewrite absolute anchors for /pqforge/ base
        run: python3 tool/fix_pages_base.py site/build/jaspr

      - name: Assemble the published site
        run: |
          set -eu
          dest=site/public
          src=site/build/jaspr
          rm -rf "$dest"
          mkdir -p "$dest/assets" "$dest/release-notes"
          # The earlier snapshot: recipe catalog, CLI, use cases, FAQ, docs.
          cp site/index.html site/styles.css site/favicon.svg site/404.html \
            site/llms.txt site/llms-full.txt site/identity.json \
            site/developer-ai.txt site/faq-ai.txt site/ai.txt \
            site/robots.txt site/robots-ai.txt site/sitemap.xml \
            "$dest/"
          cp -a site/assets/. "$dest/assets/"
          # Jaspr guides beside that homepage. Its index is the release-notes
          # page, not a replacement for the recipe homepage.
          cp "$src/index.html" "$dest/release-notes/index.html"
          for entry in "$src"/*; do
            name=$(basename "$entry")
            case "$name" in
              index.html|sitemap.xml|llms.txt|favicon.svg|packages) continue ;;
            esac
            cp -a "$entry" "$dest/$name"
          done
          test -f "$dest/index.html"
          grep -q 'id="recipes"' "$dest/index.html"
          grep -q 'id="cli"' "$dest/index.html"
          test -f "$dest/hpke/index.html"
          test -f "$dest/certificates/index.html"
          test -f "$dest/signatures/index.html"
          test -f "$dest/release-notes/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
