name: pqforge
description: >-
  Pure-Dart post-quantum and classical hybrid crypto for Dart, Flutter, and
  Serverpod: ML-KEM|ML-DSA|SLH-DSA + X25519|Ed25519|ECDSA-P256 + AEAD (AES-GCM-256/Chacha20-Poly1305) + HKDF
  envelopes, streaming, multi-recipient encryption,decryption, FIPS Mode, signing, and a CLI.
version: 0.4.4
repository: https://github.com/turkananation/pqforge/
homepage: https://turkananation.github.io/pqforge/
documentation: https://github.com/turkananation/pqforge/wiki/

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  pqcrypto: ^0.4.1
  pointycastle: ^4.0.0
  cryptography: ^2.9.0

executables:
  pqforge: pqforge

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
