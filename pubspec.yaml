name: pqforge
description: >-
  Pure-Dart post-quantum crypto for Dart, Flutter, and Serverpod: ML-KEM,
  ML-DSA, SLH-DSA, AES-256-GCM, ChaCha20-Poly1305, hybrids, streaming, and a CLI.
version: 0.4.5
repository: https://github.com/turkananation/pqforge/
homepage: https://turkananation.github.io/pqforge/
documentation: https://github.com/turkananation/pqforge/wiki/
topics:
  - cryptography
  - post-quantum
  - security
  - encryption
  - flutter

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  pqcrypto: ^0.4.1
  pointycastle: ^4.0.0
  cryptography: ^2.9.0

executables:
  pqforge: pqforge

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
